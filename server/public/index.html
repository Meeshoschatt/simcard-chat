<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>SIM Card</title>
<meta name="theme-color" content="#120E27">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- PeerJS CDN -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" onerror="this.onerror=null;document.write('<script src=\'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js\'><\/script>')"></script>

<style>
:root{
  --bg-0:#0B0A17;
  --bg-1:#151130;
  --link-a:#8B5CF6;
  --link-b:#22D3EE;
  --ok:#34D399;
  --warn:#FBBF24;
  --danger:#F87171;
  --glass-bg:rgba(255,255,255,0.06);
  --glass-bg-strong:rgba(255,255,255,0.10);
  --glass-border:rgba(255,255,255,0.14);
  --text-0:#F5F3FF;
  --text-1:#B9B4D6;
  --text-2:#7A7599;
  --radius-lg:28px;
  --radius-md:18px;
  --radius-sm:12px;
  --shadow-lift:0 20px 60px -20px rgba(0,0,0,0.6);
  --font-display:'Space Grotesk', system-ui, sans-serif;
  --font-body:'Manrope', system-ui, -apple-system, sans-serif;
}

[data-theme="light"]{
  --bg-0:#F4F2FB;
  --bg-1:#FFFFFF;
  --glass-bg:rgba(255,255,255,0.65);
  --glass-bg-strong:rgba(255,255,255,0.85);
  --glass-border:rgba(20,10,60,0.10);
  --text-0:#1C1633;
  --text-1:#514B6E;
  --text-2:#8A84A8;
  --shadow-lift:0 20px 60px -24px rgba(80,60,160,0.35);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overscroll-behavior:none;}
body{
  font-family:var(--font-body);
  color:var(--text-0);
  background:
    radial-gradient(1200px 800px at 15% -10%, rgba(139,92,246,0.35), transparent 60%),
    radial-gradient(900px 700px at 110% 10%, rgba(34,211,238,0.20), transparent 55%),
    var(--bg-0);
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
  transition:background-color .4s ease, color .4s ease;
}

button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;}
input{font-family:inherit;color:inherit;}

#app{position:relative;min-height:100vh;min-height:100dvh;}
.screen{display:none;min-height:100vh;min-height:100dvh;}
.screen.active{display:flex;flex-direction:column;}

.glass{
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:var(--shadow-lift);
}

/* HOME SCREEN */
#homeScreen{align-items:center;justify-content:flex-start;padding:28px 18px 30px;gap:20px;}

.topbar{width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{width:36px;height:42px;position:relative;flex:none;}
.brand-mark svg{width:100%;height:100%;display:block;}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:1.4rem;letter-spacing:-0.01em;}

.icon-btn{
  width:42px;height:42px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  background:var(--glass-bg);border:1px solid var(--glass-border);
  transition:transform .18s ease, background .2s ease;
}
.icon-btn:active{transform:scale(0.9);}
.icon-btn svg{width:20px;height:20px;stroke:var(--text-0);}

/* connect card */
.connect-card{width:100%;max-width:460px;border-radius:var(--radius-lg);padding:24px;}
.field-label{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);margin-bottom:12px;display:block;}
.field-wrap{display:flex;gap:10px;}
#friendIdInput{
  flex:1;padding:16px;border-radius:var(--radius-sm);
  background:var(--glass-bg-strong);border:1px solid var(--glass-border);
  font-size:1.1rem;font-weight:700;letter-spacing:.03em;color:var(--text-0);
  outline:none;transition:border-color .2s ease;
}
#friendIdInput:focus{border-color:var(--link-a);}
#friendIdInput.invalid{border-color:var(--danger);animation:shake .35s;}
@keyframes shake{25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

.field-hint{font-size:.76rem;color:var(--danger);margin-top:8px;min-height:1em;font-weight:600;}

.btn-primary{
  width:100%;margin-top:16px;padding:16px;border-radius:var(--radius-sm);
  font-weight:700;font-size:1.05rem;color:#fff;
  background:linear-gradient(100deg,var(--link-a),var(--link-b));
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 14px 30px -12px rgba(139,92,246,.55);
  transition:transform .16s ease;
}
.btn-primary:active{transform:scale(0.97);}
.btn-primary.audio-mode{background:linear-gradient(100deg,#475569,#334155);box-shadow:none;}

/* CALL SCREEN */
#callScreen{background:#000;position:relative;}
.video-stage{position:relative;flex:1;width:100%;overflow:hidden;background:#050308;}
#remoteVideo{width:100%;height:100%;object-fit:cover;background:#050308;display:block;}

.remote-placeholder{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;
  background:radial-gradient(700px 500px at 50% 30%, rgba(139,92,246,.25), transparent 60%), #0B0A17;
}
.remote-placeholder.show{display:flex;}
.avatar-ring{
  width:104px;height:104px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--link-a),var(--link-b));
  font-family:var(--font-display);font-weight:700;font-size:2.2rem;color:#fff;
  position:relative;
}
.avatar-ring::before,.avatar-ring::after{
  content:"";position:absolute;inset:-10px;border-radius:50%;border:1.5px solid rgba(139,92,246,.45);
  animation:ringExpand 2.4s ease-out infinite;
}
.avatar-ring::after{animation-delay:1.2s;}
@keyframes ringExpand{0%{transform:scale(0.8);opacity:1;}100%{transform:scale(1.6);opacity:0;}}
.remote-placeholder .r-name{font-family:var(--font-display);font-weight:700;font-size:1.1rem;}
.remote-placeholder .r-state{color:var(--text-1);font-size:.85rem;}

.local-pip{
  position:absolute;width:118px;height:157px;border-radius:18px;overflow:hidden;
  top:calc(env(safe-area-inset-top, 0px) + 78px);right:14px;
  border:2px solid rgba(255,255,255,.25);box-shadow:0 10px 26px -8px rgba(0,0,0,.6);
  background:#111;z-index:5;transition:transform .18s ease;touch-action:none;
}
#localVideo{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
#localVideo.rear{transform:scaleX(1);}
#localVideo.cam-off{visibility:hidden;}
.local-pip-off{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#1c1733,#0c0a1a);color:var(--text-1);font-size:.7rem;font-weight:700;flex-direction:column;gap:6px;
}
.local-pip-off.show{display:flex;}
.local-pip-off svg{width:22px;height:22px;stroke:var(--text-2);}

.call-topbar{
  position:absolute;top:0;left:0;right:0;z-index:6;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 40px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:linear-gradient(180deg, rgba(0,0,0,.55), transparent);
  pointer-events:none;
}
.call-topbar > *{pointer-events:auto;}
.peer-chip{display:flex;align-items:center;gap:9px;padding:8px 14px 8px 8px;border-radius:999px;}
.peer-chip .mini-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--link-a),var(--link-b));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:.85rem;color:#fff;flex:none;}
.peer-chip .peer-meta{display:flex;flex-direction:column;line-height:1.25;}
.peer-chip .peer-id{font-weight:700;font-size:.82rem;}
.peer-chip .call-timer{font-size:.72rem;color:var(--text-1);font-variant-numeric:tabular-nums;}
.top-actions{display:flex;gap:8px;}
.top-actions .icon-btn{width:38px;height:38px;background:rgba(20,16,40,.5);border-color:rgba(255,255,255,.14);}
.top-actions .icon-btn svg{stroke:#fff;}

.conn-banner{
  position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);left:50%;transform:translateX(-50%) translateY(-140%);
  z-index:8;padding:9px 16px;border-radius:999px;font-size:.76rem;font-weight:700;
  display:flex;align-items:center;gap:8px;white-space:nowrap;
  background:rgba(20,16,40,.85);border:1px solid rgba(255,255,255,.14);color:#fff;
  transition:transform .35s cubic-bezier(.2,.8,.2,1);
}
.conn-banner.show{transform:translateX(-50%) translateY(0);}
.conn-banner.warn{color:var(--warn);}
.conn-banner.bad{color:var(--danger);}
.conn-banner.good{color:var(--ok);}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:currentColor;animation:spin .7s linear infinite;flex:none;}
@keyframes spin{to{transform:rotate(360deg);}}

.call-controls{
  position:absolute;bottom:0;left:0;right:0;z-index:6;
  padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);
  background:linear-gradient(0deg, rgba(0,0,0,.65), transparent);
  display:flex;flex-direction:column;gap:14px;
}
.controls-row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;}
.ctrl-btn{
  width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);
  transition:transform .16s ease, background .2s ease;
}
.ctrl-btn svg{width:23px;height:23px;stroke:#fff;}
.ctrl-btn:active{transform:scale(0.88);}
.ctrl-btn.off{background:#fff;}
.ctrl-btn.off svg{stroke:#151130;}
.ctrl-btn.end{width:64px;height:64px;background:linear-gradient(135deg,#EF4444,#B91C1C);box-shadow:0 12px 26px -8px rgba(239,68,68,.6);}
.ctrl-btn.end svg{width:26px;height:26px;}
.ctrl-label{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);font-size:.62rem;color:rgba(255,255,255,.65);font-weight:600;white-space:nowrap;}
.ctrl-wrap{position:relative;}

/* chat panel */
.chat-panel{
  position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);
  background:var(--bg-1);
}
[data-theme="dark"] .chat-panel, :root:not([data-theme="light"]) .chat-panel{background:#120E27;}
.chat-panel.open{transform:translateY(0);}
.chat-head{
  display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;
  border-bottom:1px solid var(--glass-border);flex:none;
}
.chat-head h2{font-family:var(--font-display);font-size:1.05rem;font-weight:700;flex:1;}
.chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
.msg{max-width:78%;padding:10px 14px;border-radius:18px;font-size:.9rem;line-height:1.4;word-break:break-word;}
.msg.me{align-self:flex-end;background:linear-gradient(100deg,var(--link-a),var(--link-b));color:#fff;border-bottom-right-radius:4px;}
.msg.them{align-self:flex-start;background:var(--glass-bg-strong);border:1px solid var(--glass-border);border-bottom-left-radius:4px;}
.msg.sys{align-self:center;background:transparent;color:var(--text-2);font-size:.75rem;font-weight:600;padding:4px 10px;}
.msg .msg-time{display:block;font-size:.62rem;opacity:.7;margin-top:3px;}
.chat-foot{flex:none;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);border-top:1px solid var(--glass-border);position:relative;}
.chat-input-row{display:flex;align-items:center;gap:6px;}
#chatInput{
  flex:1;padding:12px 14px;border-radius:22px;background:var(--glass-bg-strong);
  border:1px solid var(--glass-border);font-size:.9rem;outline:none;color:var(--text-0);
}
#chatInput:focus{border-color:var(--link-a);}
.round-btn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--glass-bg-strong);border:1px solid var(--glass-border);}
.round-btn svg{width:19px;height:19px;stroke:var(--text-0);}
.round-btn.send{background:linear-gradient(100deg,var(--link-a),var(--link-b));border:none;}
.round-btn.send svg{stroke:#fff;}
.emoji-panel{
  position:absolute;bottom:100%;left:12px;right:12px;margin-bottom:8px;padding:10px;border-radius:16px;
  display:none;grid-template-columns:repeat(8,1fr);gap:4px;max-height:180px;overflow-y:auto;
  background:var(--glass-bg-strong);border:1px solid var(--glass-border);backdrop-filter:blur(20px);
}
.emoji-panel.open{display:grid;}
.emoji-panel button{font-size:1.3rem;padding:6px 0;border-radius:8px;}
.chat-fab-badge{
  position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--danger);
  color:#fff;font-size:.62rem;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 4px;
}
.chat-fab-badge.show{display:flex;}

.msg.voice{display:flex;align-items:center;gap:10px;padding:9px 12px;min-width:170px;}
.voice-play-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:rgba(255,255,255,.22);}
.voice-play-btn svg{width:15px;height:15px;}
.voice-wave{flex:1;display:flex;align-items:center;gap:2px;height:22px;}
.voice-wave span{display:block;width:3px;border-radius:2px;background:currentColor;opacity:.85;}

.record-row{display:none;align-items:center;gap:10px;}
.record-row.active{display:flex;}
.chat-input-row.hide{display:none;}
.record-dot{width:11px;height:11px;border-radius:50%;background:var(--danger);flex:none;animation:dotPulse 1s infinite;}
.record-time{flex:1;font-size:.9rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text-0);}
.record-cancel{color:var(--danger);}

/* OVERLAYS */
.overlay{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:22px;
  background:rgba(5,3,15,.72);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.overlay.show{opacity:1;pointer-events:auto;}
.overlay-card{
  width:100%;max-width:380px;border-radius:26px;padding:28px 24px;text-align:center;
  background:var(--bg-1);border:1px solid var(--glass-border);box-shadow:var(--shadow-lift);
}
.overlay-card .avatar-ring{margin:0 auto 16px;}
.overlay-card h3{font-family:var(--font-display);font-weight:700;font-size:1.2rem;margin-bottom:6px;}
.overlay-card p{color:var(--text-1);font-size:.87rem;line-height:1.5;margin-bottom:22px;}
.overlay-actions{display:flex;gap:12px;}
.overlay-actions .ctrl-btn{position:static;margin:0 auto;}
.overlay-actions-col{display:flex;flex-direction:column;gap:10px;}
.btn-secondary{width:100%;padding:14px;border-radius:14px;font-weight:700;background:var(--glass-bg-strong);border:1px solid var(--glass-border);}

#toastHost{position:fixed;left:0;right:0;bottom:24px;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px;}
.toast{
  max-width:420px;padding:12px 18px;border-radius:14px;font-size:.85rem;font-weight:600;
  background:rgba(18,14,39,.92);color:#fff;border:1px solid rgba(255,255,255,.12);
  box-shadow:0 12px 30px -10px rgba(0,0,0,.5);
}
.toast.error{border-color:rgba(248,113,113,.4);}
.toast.success{border-color:rgba(52,211,153,.4);}

.hidden{display:none !important;}
</style>
</head>
<body data-theme="dark">
<div id="app">

  <!-- HOME SCREEN -->
  <section id="homeScreen" class="screen active">
    <div class="topbar">
      <div class="brand">
        <!-- SIM Card Logo SVG -->
        <span class="brand-mark">
          <svg viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 15,5 L 65,5 L 85,25 L 85,110 C 85,113 82,115 79,115 L 21,115 C 18,115 15,113 15,110 Z" fill="#111111" stroke="#2D2942" stroke-width="3"/>
            <rect x="28" y="45" width="44" height="42" rx="6" fill="#E5A93C"/>
            <path d="M 50,45 L 50,87 M 28,59 L 72,59 M 28,73 L 72,73 M 38,45 L 38,59 M 62,45 L 62,59 M 38,73 L 38,87 M 62,73 L 62,87" stroke="#111111" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </span>
        <div>
          <div class="brand-name">SIM Card</div>
        </div>
      </div>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
      </button>
    </div>

    <!-- CONNECT CARD -->
    <div class="connect-card glass">
      <label class="field-label" for="friendIdInput">ENTER YOUR MOBILE NO.</label>
      <div class="field-wrap">
        <input id="friendIdInput" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="12">
      </div>
      <div class="field-hint" id="friendIdHint"></div>

      <button class="btn-primary" id="videoCallBtn">
        Button 1
      </button>
      <button class="btn-primary audio-mode" id="audioCallBtn" style="margin-top:10px;">
        Button 2
      </button>
    </div>
  </section>

  <!-- CALL SCREEN -->
  <section id="callScreen" class="screen">
    <div class="video-stage" id="videoStage">
      <video id="remoteVideo" autoplay playsinline></video>

      <div class="remote-placeholder show" id="remotePlaceholder">
        <div class="avatar-ring" id="remoteAvatarInitial">?</div>
        <div class="r-name" id="remoteNameLabel">Connecting…</div>
        <div class="r-state" id="remoteStateLabel">Waiting for call to connect</div>
      </div>

      <div class="conn-banner" id="connBanner"><span class="spin"></span><span id="connBannerText">Connecting…</span></div>

      <div class="call-topbar">
        <div class="peer-chip glass">
          <span class="mini-avatar" id="peerChipAvatar">?</span>
          <div class="peer-meta">
            <span class="peer-id" id="peerChipId">—</span>
            <span class="call-timer" id="callTimer">00:00</span>
          </div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="switchCamBtn" title="Switch camera">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4v5h-5"/><path d="M4 20v-5h5"/><path d="M4 9a9 9 0 0 1 15-4.7L20 7"/><path d="M20 15a9 9 0 0 1-15 4.7L4 17"/></svg>
          </button>
          <button class="icon-btn" id="fullscreenBtn" title="Fullscreen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          </button>
        </div>
      </div>

      <div class="local-pip" id="localPip">
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="local-pip-off" id="localPipOff">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 16v1a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h2M22 8.5V15.5"/><path d="m2 2 20 20"/></svg>
          Camera off
        </div>
      </div>

      <div class="call-controls">
        <div class="controls-row">
          <div class="ctrl-wrap">
            <button class="ctrl-btn" id="muteBtn" title="Mute">
              <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>
            </button>
            <span class="ctrl-label">Mute</span>
          </div>
          <div class="ctrl-wrap">
            <button class="ctrl-btn" id="camBtn" title="Camera">
              <svg id="camIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
            </button>
            <span class="ctrl-label">Camera</span>
          </div>
          <div class="ctrl-wrap">
            <button class="ctrl-btn end" id="endCallBtn" title="End call">

            <input id="chatInput" type="text" placeholder="Type a message…" maxlength="500" autocomplete="off">

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05 12.25 20.24a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.67 3.67 0 0 1 5.19 5.19L9.66 17.65a1.83 1.83 0 0 1-2.6-2.6l8.49-8.48"/></svg>
            </button>
            <button class="round-btn" id="micBtn" aria-label="Record voice message">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>
            </button>
            <button class="round-btn send" id="sendChatBtn" aria-label="Send">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4 20-7z"/></svg>
            </button>
          </div>
          <div class="record-row" id="recordRow">
            <button class="round-btn record-cancel" id="cancelRecordBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
            </button>
            <span class="record-dot"></span>
            <span class="record-time" id="recordTime">0:00</span>
            <button class="round-btn send" id="stopRecordBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4 20-7z"/></svg>

  <!-- OVERLAYS -->
  <div class="overlay" id="incomingOverlay">

      <div class="avatar-ring" id="incomingAvatar">?</div>

      <div class="overlay-actions">
        <div class="ctrl-wrap" style="flex:1;">
          <button class="ctrl-btn end" id="declineCallBtn" style="width:100%;height:58px;border-radius:16px;">
            <svg viewBox="0 0 24 24" fill="#fff" stroke="none"><path d="M12 9c-3 0-5.7.9-8 2.4a1.5 1.5 0 0 0-.4 2.1l1.6 2.3a1.5 1.5 0 0 0 2 .4l2-1.2a1.5 1.5 0 0 1 1.6.1c.4.3.8.5 1.2.7.4-.2.8-.4 1.2-.7a1.5 1.5 0 0 1 1.6-.1l2 1.2a1.5 1.5 0 0 0 2-.4l1.6-2.3a1.5 1.5 0 0 0-.4-2.1C17.7 9.9 15 9 12 9z" transform="rotate(135 12 12)"/></svg>
          </button>
        </div>
        <div class="ctrl-wrap" style="flex:1;">
          <button class="ctrl-btn" id="acceptCallBtn" style="width:100%;height:58px;border-radius:16px;background:linear-gradient(135deg,#34D399,#059669);">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </button>
        </div>

  <div class="overlay" id="permissionOverlay">
    <div class="overlay-card">
      <div class="avatar-ring" style="background:linear-gradient(135deg,#F87171,#B91C1C);">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/><path d="m2 2 20 20"/></svg>
      </div>
      <h3 id="permTitle">Camera / Mic Needed</h3>
      <p id="permText">Allow camera and microphone access in browser settings and try again.</p>
      <div class="overlay-actions-col">
        <button class="btn-secondary" id="retryPermBtn">Try again</button>
        <button class="btn-secondary" id="closePermBtn">Cancel</button>

    <div class="overlay-card">
      <div class="avatar-ring" id="endedAvatar">?</div>
      <h3>Call ended</h3>
      <p id="endedText">Call duration 00:00</p>
      <div class="overlay-actions-col">
        <button class="btn-secondary" id="backHomeBtn">Back to home</button>
      </div>

  </div>

  <div id="toastHost"></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);

const DEFAULT_ID = '445566';

const state = {
  peer:null,
  myId:DEFAULT_ID,
  localStream:null,
  currentCall:null,
  dataConn:null,
  pendingIncomingCall:null,
  isCaller:false,
  friendId:null,
  facingMode:'user',
  audioOnly:false,
  micOn:true,
  camOn:true,
  speakerLoud:true,
  timerHandle:null,
  seconds:0,
  reconnectAttempts:0,
  unreadChat:0,
  chatOpen:false,
  ended:false,
  ringTimeout:null,
  streamReceived:false,
  mediaRecorder:null,
  recChunks:[],
  recStartTs:0,
  recTimerHandle:null,
  recStream:null,
};

function generateRandomId(){
  return String(Math.floor(100000 + Math.random()*900000));
}

function sanitizeId(raw){
  return raw.trim().replace(/[^0-9]/g,'').slice(0,12);
}

function toast(msg, type=''){
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  $('toastHost').appendChild(t);
  setTimeout(()=>t.remove(), 3100);
}

function initTheme(){
  const saved = localStorage.getItem('fc-theme');
  const theme = saved || 'dark';
  document.body.setAttribute('data-theme', theme);
  updateThemeIcon(theme);
}
function updateThemeIcon(theme){
  $('themeIcon').innerHTML = theme === 'dark'
    ? '<path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
}
$('themeToggle').addEventListener('click', ()=>{
  const cur = document.body.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.body.setAttribute('data-theme', next);
  localStorage.setItem('fc-theme', next);
  updateThemeIcon(next);
});

function initPeer(idToUse){
  const id = idToUse || DEFAULT_ID;
  const peerOpts = {
    debug:1,
    config:{
      iceServers:[
        { urls:'stun:stun.l.google.com:19302' },
        { urls:'stun:stun1.l.google.com:19302' },
        { urls:'stun:stun2.l.google.com:19302' },
        { urls:'turn:openrelay.metered.ca:80', username:'openrelayproject', credential:'openrelayproject' },
        { urls:'turn:openrelay.metered.ca:443', username:'openrelayproject', credential:'openrelayproject' },
        { urls:'turn:openrelay.metered.ca:443?transport=tcp', username:'openrelayproject', credential:'openrelayproject' }
      ],
      iceCandidatePoolSize: 4
    }
  };

  const peer = new Peer(id, peerOpts);

  peer.on('open', (openedId)=>{
    state.myId = openedId;
    state.reconnectAttempts = 0;
  });

  peer.on('call', (call)=>{
    if(state.currentCall){
      setTimeout(()=>{
        if(state.dataConn && state.dataConn.peer === call.peer && state.dataConn.open){
          try{ state.dataConn.send({ type:'call-busy' }); }catch(e){}
        }
      }, 400);
      call.close();
      return;
    }
    state.pendingIncomingCall = call;
    showIncomingCall(call.peer, call.metadata && call.metadata.audioOnly);
  });

  peer.on('connection', (conn)=>{
    state.dataConn = conn;
    wireDataConnection(conn);
  });

  peer.on('disconnected', ()=>{
    attemptReconnect();
  });

  peer.on('error', (err)=>{
    console.error('Peer error:', err);
    handlePeerError(err);
  });

  state.peer = peer;
}

function attemptReconnect(){
  if(!state.peer || state.peer.destroyed) return;
  state.reconnectAttempts++;
  if(state.reconnectAttempts > 8) return;
  setTimeout(()=>{
    if(state.peer && state.peer.disconnected && !state.peer.destroyed){
      state.peer.reconnect();
    }
  }, 2000);
}

function handlePeerError(err){
  const type = err && err.type;
  switch(type){
    case 'unavailable-id':
      startWithNewId(generateRandomId());
      break;
    case 'peer-unavailable':
      toast("Target Mobile No. is not online.", 'error');
      resetToHome();
      break;
    default:
      toast('Connection error', 'error');
  }
}

function startWithNewId(customId){
  if(state.peer) state.peer.destroy();
  const nextId = customId || generateRandomId();
  initPeer(nextId);
}

const friendInput = $('friendIdInput');
friendInput.value = ''; // Blank input by default

friendInput.addEventListener('input', ()=>{
  friendInput.value = sanitizeId(friendInput.value);
  friendInput.classList.remove('invalid');
  $('friendIdHint').textContent = '';
});

function validateFriendInput(){
  const raw = sanitizeId(friendInput.value) || DEFAULT_ID;
  friendInput.value = raw;
  if(raw === state.myId){
    friendInput.classList.add('invalid');
    $('friendIdHint').textContent = "Cannot call own number";
    return null;
  }
  return raw;
}

$('videoCallBtn').addEventListener('click', ()=> startOutgoingCall(false));
$('audioCallBtn').addEventListener('click', ()=> startOutgoingCall(true));

async function getMedia({ audioOnly=false } = {}){
  const constraints = {
    audio:{ echoCancellation:true, noiseSuppression:true },
    video: audioOnly ? false : { facingMode: state.facingMode, width:{ ideal:1280 }, height:{ ideal:720 } }
  };
  try{
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    state.audioOnly = audioOnly;
    return stream;
  }catch(err){
    console.error('getUserMedia error:', err);
    if(err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError'){
      showPermissionError('Camera / Mic Blocked', 'Allow camera and microphone access in browser settings.');
    }else if(!audioOnly){
      toast('Camera not found — starting audio call.', 'error');
      return getMedia({ audioOnly:true });
    }else{
      showPermissionError('Media Error', err.message || 'Could not access camera/mic.');
    }
    throw err;
  }
}

async function startOutgoingCall(audioOnly){
  const friendId = validateFriendInput();
  if(!friendId) return;
  if(!state.peer || state.peer.disconnected){
    toast('Connecting to server… please wait.', 'error');
    return;
  }

  state.friendId = friendId;
  state.isCaller = true;
  state.streamReceived = false;

  try{
    const stream = await getMedia({ audioOnly });
    state.localStream = stream;
    enterCallScreen(friendId, audioOnly);

    const call = state.peer.call(friendId, stream, { metadata:{ audioOnly } });
    if(!call){
      toast('Call failed.', 'error');
      exitToHome();
      return;
    }
    state.currentCall = call;
    wireMediaCall(call);
    showConnBanner('Calling ' + friendId + '…', 'warn');

    const conn = state.peer.connect(friendId, { reliable:true });
    state.dataConn = conn;
    wireDataConnection(conn);

    clearTimeout(state.ringTimeout);
    state.ringTimeout = setTimeout(()=>{
      if(!state.streamReceived && state.currentCall){
        finishCall("No answer from " + friendId);
      }
    }, 45000);

  }catch(e){}
}

function showIncomingCall(fromId, isAudioOnly){
  $('incomingAvatar').textContent = fromId.charAt(0).toUpperCase();
  $('incomingTitle').textContent = isAudioOnly ? 'Incoming Audio Call' : 'Incoming Video Call';
  $('incomingSub').textContent = fromId + ' is calling…';
  $('incomingOverlay').classList.add('show');
}
function hideIncomingCall(){
  $('incomingOverlay').classList.remove('show');
}

$('acceptCallBtn').addEventListener('click', async ()=>{
  const call = state.pendingIncomingCall;
  if(!call) return;
  hideIncomingCall();
  state.isCaller = false;
  state.friendId = call.peer;
  const wantsAudioOnly = !!(call.metadata && call.metadata.audioOnly);

  try{
    const stream = await getMedia({ audioOnly: wantsAudioOnly });
    state.localStream = stream;
    enterCallScreen(call.peer, wantsAudioOnly);
    call.answer(stream);
    state.currentCall = call;
    wireMediaCall(call);
    showConnBanner('Connecting…','warn');
  }catch(e){
    call.close();
  }
  state.pendingIncomingCall = null;
});

$('declineCallBtn').addEventListener('click', ()=>{
  if(state.pendingIncomingCall){
    notifyPeer({ type:'call-declined' });
    state.pendingIncomingCall.close();
    state.pendingIncomingCall = null;
  }
  hideIncomingCall();
});

function notifyPeer(msg){
  if(state.dataConn && state.dataConn.open){
    try{ state.dataConn.send(msg); }catch(e){}
  }
}

function wireMediaCall(call){
  call.on('stream', (remoteStream)=>{
    state.streamReceived = true;
    clearTimeout(state.ringTimeout);
    const remoteVideo = $('remoteVideo');
    remoteVideo.srcObject = remoteStream;
    $('remotePlaceholder').classList.remove('show');
    showConnBanner('Connected','good');
    setTimeout(()=>hideConnBanner(), 1800);
    startCallTimer();
    updateRemoteMeta(call.peer);
  });

  call.on('close', ()=>{ finishCall('Call ended.'); });
  call.on('error', (err)=>{ finishCall('Call interrupted.'); });

  const pc = call.peerConnection;
  if(pc){
    pc.oniceconnectionstatechange = ()=>{
      const s = pc.iceConnectionState;
      if(s === 'connected' || s === 'completed'){ showConnBanner('Connected','good'); setTimeout(hideConnBanner, 1500); }
      else if(s === 'failed'){ finishCall('Connection lost.'); }
    };
  }
}

function updateRemoteMeta(id){
  const initial = id.charAt(0).toUpperCase();
  $('remoteAvatarInitial').textContent = initial;
  $('remoteNameLabel').textContent = id;
  $('peerChipAvatar').textContent = initial;
  $('peerChipId').textContent = id;
  $('incomingAvatar').textContent = initial;
  $('endedAvatar').textContent = initial;
}

function wireDataConnection(conn){
  conn.on('open', ()=>{ addSystemMessage('Connected.'); });
  conn.on('data', (payload)=>{
    if(!payload) return;
    if(payload.type === 'chat'){ addChatMessage(payload.text, 'them', payload.time); if(!state.chatOpen) bumpUnread(); }
    else if(payload.type === 'voice'){ addVoiceMessage(payload.blob, payload.duration, 'them', payload.time); if(!state.chatOpen) bumpUnread(); }
    else if(payload.type === 'call-declined'){ clearTimeout(state.ringTimeout); finishCall('Call declined.'); }
    else if(payload.type === 'call-busy'){ clearTimeout(state.ringTimeout); finishCall('Busy on another call.'); }
  });
  conn.on('close', ()=>{ addSystemMessage('Chat disconnected.'); });
}

function sendChat(text){
  const trimmed = text.trim();
  if(!trimmed) return;
  const time = Date.now();
  if(state.dataConn && state.dataConn.open){ state.dataConn.send({ type:'chat', text:trimmed, time }); }
  addChatMessage(trimmed, 'me', time);
}

function addChatMessage(text, who, time){
  const body = $('chatBody');
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  const timeStr = new Date(time || Date.now()).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  div.innerHTML = `${escapeHtml(text)}<span class="msg-time">${timeStr}</span>`;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}
function addSystemMessage(text){
  const body = $('chatBody');
  const div = document.createElement('div');
  div.className = 'msg sys';
  div.textContent = text;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}
function escapeHtml(str){
  const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
}

$('sendChatBtn').addEventListener('click', ()=>{ sendChat($('chatInput').value); $('chatInput').value = ''; $('chatInput').focus(); });
$('chatInput').addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); $('sendChatBtn').click(); } });
$('chatBtn').addEventListener('click', openChat);
$('closeChatBtn').addEventListener('click', closeChat);
function openChat(){ $('chatPanel').classList.add('open'); state.chatOpen = true; clearUnread(); }
function closeChat(){ $('chatPanel').classList.remove('open'); state.chatOpen = false; }
function bumpUnread(){ state.unreadChat++; const badge = $('chatBadge'); badge.textContent = state.unreadChat; badge.classList.add('show'); }
function clearUnread(){ state.unreadChat = 0; $('chatBadge').classList.remove('show'); }

const EMOJIS = ['😀','😂','😍','😊','😉','😎','🤩','🥳','😢','😮','👍','👏','🙏','🔥','❤️','💯','🎉','🤔','😴','😅'];
(function buildEmojiPanel(){
  const panel = $('emojiPanel');
  EMOJIS.forEach(e=>{
    const b = document.createElement('button'); b.type='button'; b.textContent = e;
    b.addEventListener('click', ()=>{ $('chatInput').value += e; $('chatInput').focus(); });
    panel.appendChild(b);
  });
})();
$('emojiBtn').addEventListener('click', ()=>{ $('emojiPanel').classList.toggle('open'); });

function pickRecorderMime(){
  const candidates = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];
  for(const c of candidates){
    if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
  }
  return '';
}

async function startVoiceRecording(){
  if(!navigator.mediaDevices || !window.MediaRecorder || !state.dataConn || !state.dataConn.open) return;
  try{
    let recStream = state.localStream;
    let ownsStream = false;
    if(!recStream || recStream.getAudioTracks().length === 0){
      recStream = await navigator.mediaDevices.getUserMedia({ audio:true });
      ownsStream = true;
    }
    state.recStream = ownsStream ? recStream : null;

    const mime = pickRecorderMime();
    const recorder = new MediaRecorder(recStream, mime ? { mimeType:mime } : undefined);
    state.recChunks = [];
    recorder.ondataavailable = (e)=>{ if(e.data && e.data.size>0) state.recChunks.push(e.data); };
    recorder.start();
    state.mediaRecorder = recorder;
    state.recStartTs = Date.now();

    $('chatInputRow').classList.add('hide');
    $('recordRow').classList.add('active');
    $('recordTime').textContent = '0:00';
    state.recTimerHandle = setInterval(()=>{
      const secs = Math.floor((Date.now()-state.recStartTs)/1000);
      const m = Math.floor(secs/60), s = secs%60;
      $('recordTime').textContent = m+':'+String(s).padStart(2,'0');
      if(secs >= 120){ stopVoiceRecording(true); }
    }, 250);
  }catch(err){}
}

function stopVoiceRecording(send){
  const recorder = state.mediaRecorder;
  clearInterval(state.recTimerHandle); state.recTimerHandle = null;
  $('chatInputRow').classList.remove('hide'); $('recordRow').classList.remove('active');
  if(!recorder) return;

  const durationSec = Math.max(1, Math.round((Date.now()-state.recStartTs)/1000));
  recorder.onstop = ()=>{
    if(state.recStream){ state.recStream.getTracks().forEach(t=>t.stop()); state.recStream=null; }
    if(!send){ state.recChunks = []; state.mediaRecorder = null; return; }
    const blob = new Blob(state.recChunks, { type: recorder.mimeType || 'audio/webm' });
    state.recChunks = []; state.mediaRecorder = null;
    if(blob.size === 0) return;
    const time = Date.now();
    if(state.dataConn && state.dataConn.open){
      try{ state.dataConn.send({ type:'voice', blob, duration:durationSec, time }); }catch(e){}
    }
    addVoiceMessage(blob, durationSec, 'me', time);
  };
  try{ recorder.stop(); }catch(e){}
}

$('micBtn').addEventListener('click', startVoiceRecording);
$('stopRecordBtn').addEventListener('click', ()=> stopVoiceRecording(true));
$('cancelRecordBtn').addEventListener('click', ()=> stopVoiceRecording(false));

$('attachAudioBtn').addEventListener('click', ()=>{
  if(state.dataConn && state.dataConn.open) $('audioFileInput').click();
});

$('audioFileInput').addEventListener('change', async (e)=>{
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file || !state.dataConn || !state.dataConn.open) return;
  const time = Date.now();
  try{ state.dataConn.send({ type:'voice', blob:file, duration:1, time }); }catch(err){}
  addVoiceMessage(file, 1, 'me', time);
});

function addVoiceMessage(blob, duration, who, time){
  const body = $('chatBody');
  const div = document.createElement('div');
  div.className = 'msg voice ' + who;
  let url = URL.createObjectURL(blob);
  const audio = new Audio(url);
  const bars = Array.from({length:18}, ()=> 4 + Math.round(Math.random()*14));

  div.innerHTML = `
    <button class="voice-play-btn" aria-label="Play">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <span class="voice-wave">${bars.map(h=>`<span style="height:${h}px"></span>`).join('')}</span>
    <span class="voice-dur">${duration}s</span>
  `;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;

  const playBtn = div.querySelector('.voice-play-btn');
  playBtn.addEventListener('click', ()=>{
    if(audio.paused) audio.play(); else audio.pause();
  });
}

$('muteBtn').addEventListener('click', ()=>{
  if(!state.localStream) return;
  state.micOn = !state.micOn;
  state.localStream.getAudioTracks().forEach(t=> t.enabled = state.micOn);
  $('muteBtn').classList.toggle('off', !state.micOn);
});

$('camBtn').addEventListener('click', ()=>{
  if(!state.localStream || state.audioOnly) return;
  state.camOn = !state.camOn;
  state.localStream.getVideoTracks().forEach(t=> t.enabled = state.camOn);
  $('camBtn').classList.toggle('off', !state.camOn);
  $('localVideo').classList.toggle('cam-off', !state.camOn);
  $('localPipOff').classList.toggle('show', !state.camOn);
});

$('speakerBtn').addEventListener('click', ()=>{
  state.speakerLoud = !state.speakerLoud;
  $('remoteVideo').volume = state.speakerLoud ? 1.0 : 0.35;
  $('speakerBtn').classList.toggle('off', !state.speakerLoud);
});

$('switchCamBtn').addEventListener('click', switchCamera);
async function switchCamera(){
  if(!state.localStream || state.audioOnly) return;
  state.facingMode = state.facingMode === 'user' ? 'environment' : 'user';
  try{
    const newStream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode: state.facingMode, width:{ ideal:1280 }, height:{ ideal:720 } },
      audio:false
    });
    const newTrack = newStream.getVideoTracks()[0];
    const oldTrack = state.localStream.getVideoTracks()[0];
    if(state.currentCall && state.currentCall.peerConnection){
      const sender = state.currentCall.peerConnection.getSenders().find(s=> s.track && s.track.kind === 'video');
      if(sender) await sender.replaceTrack(newTrack);
    }
    if(oldTrack){ oldTrack.stop(); state.localStream.removeTrack(oldTrack); }
    state.localStream.addTrack(newTrack);
    $('localVideo').srcObject = state.localStream;
  }catch(err){}
}

$('fullscreenBtn').addEventListener('click', ()=>{
  const stage = $('videoStage');
  if(!document.fullscreenElement) stage.requestFullscreen().catch(()=>{});
  else document.exitFullscreen().catch(()=>{});
});

$('endCallBtn').addEventListener('click', ()=>{ finishCall('Call ended.'); });

function startCallTimer(){
  if(state.timerHandle) return;
  state.seconds = 0;
  state.timerHandle = setInterval(()=>{
    state.seconds++;
    const m = Math.floor(state.seconds/60), s = state.seconds%60;
    $('callTimer').textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }, 1000);
}
function stopCallTimer(){
  if(state.timerHandle){ clearInterval(state.timerHandle); state.timerHandle = null; }
}

function showConnBanner(text, mood){
  const b = $('connBanner');
  $('connBannerText').textContent = text;
  b.className = 'conn-banner show' + (mood ? ' '+mood : '');
  b.querySelector('.spin').style.display = (mood==='good'||mood==='bad') ? 'none' : 'block';
}
function hideConnBanner(){ $('connBanner').classList.remove('show'); }

function enterCallScreen(friendId, audioOnly){
  state.ended = false;
  $('homeScreen').classList.remove('active');
  $('callScreen').classList.add('active');
  $('localVideo').srcObject = state.localStream;
  $('localVideo').classList.toggle('cam-off', audioOnly);
  $('localPipOff').classList.toggle('show', audioOnly);
  $('remotePlaceholder').classList.add('show');
  updateRemoteMeta(friendId);
  $('callTimer').textContent = '00:00';
  $('chatBody').innerHTML = '';
  clearUnread();
}

function finishCall(reason){
  if(state.ended) return;
  state.ended = true;
  stopCallTimer();
  clearTimeout(state.ringTimeout);

  if(state.currentCall){ try{ state.currentCall.close(); }catch(e){} }
  if(state.dataConn){ try{ state.dataConn.close(); }catch(e){} }
  if(state.localStream){ state.localStream.getTracks().forEach(t=>t.stop()); }

  $('endedText').textContent = reason;
  $('endedOverlay').classList.add('show');

  state.currentCall = null;
  state.dataConn = null;
  state.localStream = null;
}

$('backHomeBtn').addEventListener('click', ()=>{
  $('endedOverlay').classList.remove('show');
  exitToHome();
});

function exitToHome(){
  $('callScreen').classList.remove('active');
  $('homeScreen').classList.add('active');
  closeChat();
  hideConnBanner();
  friendInput.value = '';
  state.seconds = 0;
  state.micOn = true; state.camOn = true; state.speakerLoud = true;
}
function resetToHome(){
  if(state.currentCall) finishCall('Could not connect.');
  else exitToHome();
}

function showPermissionError(title, text){
  $('permTitle').textContent = title;
  $('permText').textContent = text;
  $('permissionOverlay').classList.add('show');
}
$('closePermBtn').addEventListener('click', ()=>{ $('permissionOverlay').classList.remove('show'); exitToHome(); });
$('retryPermBtn').addEventListener('click', async ()=>{
  $('permissionOverlay').classList.remove('show');
  if(!state.peer) initPeer();
  if(state.friendId) await startOutgoingCall(state.audioOnly);
});

initTheme();
initPeer(DEFAULT_ID);

window.addEventListener('pagehide', ()=>{
  if(state.localStream) state.localStream.getTracks().forEach(t=>t.stop());
  if(state.peer) state.peer.destroy();
});
</script>
</body>
</html>
